# Evaluation queries for testing HoloViz skills
# Each query tests whether SKILL.md files improve the agent's responses
#
# Coverage note: the hvplot and panel skills have queries below. scripts/README.md
# lists what the other skills have (and how to add more).
#
# NOTE: `expected_output` and `category` fields below are NOT read or
# enforced by scripts/eval.py (see load_queries/run_generation, which only use
# `id`, `prompt`, and `timeout`). They are documentation-only / reserved for
# future use. `execute_generated.py` can now save and screenshot:
#   - static_plot: HoloViews `Dimensioned`, Bokeh `Model`, or matplotlib figure
#   - panel_app:   Panel `Viewable` / `Viewer` object (`pn.io.save` + screenshot)
# Do not call `pn.serve(...)` in generated code — the executor runs the file to
# completion, so a blocking server call hits the execution timeout.

queries:
  - id: hvplot_earthquake_plot
    prompt: |
      I'm working with the earthquake dataset from the sampledata module.
      Create an hvplot map visualization using a dark CartoDB tile basemap, colored by magnitude.
    expected_output: static_plot
    timeout: 600
    category: hvplot

  - id: panel_sunset_app
    prompt: |
      Create a sunrise/sunset app using the astral package with holoviz.
      It should take a lat / lon and then create an area chart with a red vertical line marking the current date time.
      Do not try to create an env.
    expected_output: panel_app
    timeout: 600
    category: panel
