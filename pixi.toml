[workspace]
name = "holoviz-skills"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[environments]
default = ["docs", "lint", "dev"]
docs = ["docs"]
lint = ["lint"]
eval = ["eval"]
build = ["build"]

# =================== BASE ===================

[dependencies]
python = ">=3.12"
pip = "*"

[tasks]
setup-dev = { depends-on = [
    "lint-install",
], description = "Set up development environment" }
build-plugin = { cmd = "python scripts/build_plugin.py", description = "Build the Claude Cowork plugin and per-skill zips (assets/)" }

# =================== BUILD ===================

[feature.build.dependencies]
python-build = "*"
hatchling = "*"
hatch-vcs = "*"

[feature.build.tasks]
build-pip = 'python -m build --wheel .'

# =================== DOCS ====================

[feature.docs.dependencies]
zensical = "*"
panel = "*"
panel-material-ui = "*"
holoviews = "*"
hvplot = "*"
bokeh = "*"
pandas = "*"
numpy = "*"

[feature.docs.pypi-dependencies]
playwright = "*"

[feature.docs.tasks]
_docs-setup = { cmd = "playwright install chromium", description = "Install Playwright browser for screenshots" }
build-stubs = { cmd = "python scripts/build_stubs.py", depends-on = ["_docs-setup"], description = "Generate docs/skills/*.md from SKILL.md files" }
docs = { cmd = "zensical serve", depends-on = [
    "docs-build",
], description = "Serve documentation locally" }
docs-build = { cmd = "zensical build", depends-on = [
    "build-stubs",
    "build-plugin",
], description = "Build static documentation" }

# =================== DEV ===================

[feature.dev.dependencies]
jupyterlab = "*"

[feature.dev.tasks]
lab = { cmd = "jupyter lab", description = "Launch JupyterLab" }

# =================== LINT ====================

[feature.lint.dependencies]
pre-commit = "*"
ruff = "*"
codespell = "*"
tomli = "*"

[feature.lint.tasks]
lint = { cmd = "pre-commit run --all-files", description = "Run all pre-commit hooks" }
lint-install = { cmd = "pre-commit install", description = "Install pre-commit hooks" }
format = { cmd = "ruff format .", description = "Format code with ruff" }
check = { cmd = "ruff check .", description = "Lint code with ruff" }

# =================== EVAL ====================

[feature.eval.dependencies]
pyyaml = "*"
holoviews = "*"
hvplot = "*"
bokeh = "*"
pandas = "*"
matplotlib = "*"
geoviews = "*"
hvsampledata = "*"

[feature.eval.pypi-dependencies]
playwright = "*"

[feature.eval.tasks]
_eval-setup = { cmd = "playwright install chromium", description = "Install Playwright browser for screenshots" }
_eval-check-no-screenshots = { cmd = "python scripts/test_setup.py --skip-screenshots", cwd = ".", description = "Verify evaluation system (without Playwright check)" }
eval-check = { cmd = "python scripts/test_setup.py", cwd = ".", description = "Verify evaluation system is set up correctly" }
evals = { cmd = "python scripts/eval.py", cwd = ".", depends-on = [
    "eval-check",
    "_eval-setup",
], description = "Run full evaluation pipeline" }
eval-no-screenshots = { cmd = "python scripts/eval.py --skip-screenshots", cwd = ".", depends-on = [
    "_eval-check-no-screenshots",
], description = "Run evaluation without screenshots (faster, no Playwright needed)" }
