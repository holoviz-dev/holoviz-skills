[project]
site_name = "HoloViz Skills"
site_description = "A curated collection of Skills for the HoloViz ecosystem — Panel, hvPlot, HoloViews, Param, and more."
site_author = "HoloViz"
repo_url = "https://github.com/holoviz-dev/holoviz-skills"
repo_name = "holoviz-dev/holoviz-skills"
edit_uri = "edit/main/docs/"
extra_javascript = ["assets/copy-markdown.js"]
nav = [
  { "Home" = "index.md" },
  { "Developing with HoloViz Packages" = [
    "developing-with-holoviz/index.md",
    { "Using Param effectively" = "developing-with-holoviz/param.md" },
    { "Using hvPlot effectively" = "developing-with-holoviz/hvplot.md" },
    { "Using Panel effectively" = "developing-with-holoviz/panel.md" },
    { "Using Panel Material UI effectively" = "developing-with-holoviz/panel-material-ui.md" },
    { "Panel + HoloViews Integration" = "developing-with-holoviz/panel-holoviews.md" },
    { "Panel Custom Components" = "developing-with-holoviz/panel-custom-components.md" },
    { "Panel Playwright UI Testing" = "developing-with-holoviz/panel-pytest-playwright.md" },
  ] },
  { "Contributing to HoloViz Packages" = [
    "contributing-to-holoviz/index.md",
    { "Code Cleanup" = "contributing-to-holoviz/cleanup.md" },
    { "Documentation" = "contributing-to-holoviz/documentation.md" },
    { "Testing" = "contributing-to-holoviz/testing.md" },
  ] },
  { "Creating Custom HoloViz Skills" = "creating-custom-holoviz-skills.md" },
]

# Theme configuration
[project.theme]
logo = "assets/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow"
]

# Color palette - light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

# Color palette - dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
url_download = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.superfences]

# Plugins
[project.plugins]
search = {}

# Extra configuration
[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/holoviz-dev"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/panel_org"

[[project.extra.social]]
icon = "fontawesome/brands/discourse"
link = "https://discourse.holoviz.org/"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/invite/rb6gPXbdAr"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/panel-org"
