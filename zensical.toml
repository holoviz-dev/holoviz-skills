[project]
site_name = "HoloViz Skills"
site_description = "A curated collection of Skills for the HoloViz ecosystem — Panel, hvPlot, HoloViews, Param, and more."
site_author = "HoloViz"
repo_url = "https://github.com/holoviz-dev/holoviz-skills"
repo_name = "holoviz-dev/holoviz-skills"
edit_uri = "edit/main/docs/"
extra_javascript = ["assets/copy-markdown.js", "assets/download-zip.js"]
nav = [
  { "Home" = "index.md" },
  { "Developing with HoloViz" = [
    "developing-with-holoviz/index.md",
    { "Param" = "developing-with-holoviz/param.md" },
    { "hvPlot" = [
      "developing-with-holoviz/hvplot/index.md",
      { "Composing Exploratory Plots" = "developing-with-holoviz/hvplot/composing-exploratory-plots.md" },
      { "Distilling Explanatory Plots" = "developing-with-holoviz/hvplot/distilling-explanatory-plots.md" },
    ] },
    { "Panel" = [
      "developing-with-holoviz/panel/index.md",
      { "Iterating on Panel Apps" = "developing-with-holoviz/panel/iterating-on-panel-apps.md" },
      { "Building Custom Components" = "developing-with-holoviz/panel/building-custom-components.md" },
      { "Using Material UI" = "developing-with-holoviz/panel/using-material-ui.md" },
      { "Using Pytest Playwright" = "developing-with-holoviz/panel/using-pytest-playwright.md" },
      { "Reviewing Panel Apps" = "developing-with-holoviz/panel/reviewing-panel-apps.md" },
      { "Converting Designs to Material UI" = "developing-with-holoviz/panel/converting-designs-to-material-ui.md" },
      { "Data Storytelling" = "developing-with-holoviz/panel/data-storytelling.md" },
      { "Designing Panel Architecture" = "developing-with-holoviz/panel/designing-panel-architecture.md" },
      { "Migrating to Material UI" = "developing-with-holoviz/panel/migrating-to-material-ui.md" },
      { "Plotting in Panel" = "developing-with-holoviz/panel/plotting-in-panel.md" },
      { "Troubleshooting Panel Apps" = "developing-with-holoviz/panel/troubleshooting.md" },
      { "Using Tabulator" = "developing-with-holoviz/panel/using-tabulator.md" },
      { "Examples" = [
        { "Dashboard" = "developing-with-holoviz/panel/dashboard.md" },
        { "Graphic Story" = "developing-with-holoviz/panel/graphic_story.md" },
        { "Wizard" = "developing-with-holoviz/panel/wizard.md" },
      ] },
    ] },
    { "HoloViews" = [
      "developing-with-holoviz/holoviews/index.md",
      { "Decluttering Plots" = "developing-with-holoviz/holoviews/decluttering-plots.md" },
    ] },
  ] },
  { "Contributing to HoloViz" = [
    "contributing-to-holoviz/index.md",
    { "Cleanup" = "contributing-to-holoviz/cleanup.md" },
    { "Documentation" = "contributing-to-holoviz/documentation.md" },
    { "Minimal Examples" = "contributing-to-holoviz/minimal-example.md" },
    { "PR Descriptions" = "contributing-to-holoviz/pr-description.md" },
    { "Testing" = "contributing-to-holoviz/testing.md" },
  ] },
  { "Creating Custom Skills" = "creating-custom-holoviz-skills.md" },
]

# Theme configuration
[project.theme]
logo = "assets/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow"
]

# Color palette - light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

# Color palette - dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
url_download = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.superfences]

# Plugins
[project.plugins]
search = {}

# Extra configuration
[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/holoviz-dev"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/panel_org"

[[project.extra.social]]
icon = "fontawesome/brands/discourse"
link = "https://discourse.holoviz.org/"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/invite/rb6gPXbdAr"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/panel-org"
